# Builds and publishes the Misfit Mercenaries site to GitHub Pages,
# and refreshes the DayZ stats (status, population, leaderboards).
# Runs: on every push to main, every 30 minutes, and on demand (Actions tab > Run workflow).
# Stats are saved on a separate "stats-data" branch so the main history stays clean.
name: Build site and update stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore saved stats
        run: |
          mkdir -p site/data/live
          if git ls-remote --exit-code --heads origin stats-data >/dev/null 2>&1; then
            git fetch --depth=1 origin stats-data
            git archive FETCH_HEAD | tar -x -C site/data/live
            echo "Restored stats from the stats-data branch"
          else
            echo "No saved stats yet"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update stats
        continue-on-error: true
        env:
          CFTOOLS_APP_ID: ${{ secrets.CFTOOLS_APP_ID }}
          CFTOOLS_SECRET: ${{ secrets.CFTOOLS_SECRET }}
        run: node scripts/update-stats.mjs

      - name: Save stats
        run: |
          cd site/data/live
          if [ -z "$(ls -A)" ]; then echo "Nothing to save"; exit 0; fi
          git init -q
          git checkout -q -b stats-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Stats update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" stats-data
          rm -rf .git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reuse thumbnails from earlier runs
        uses: actions/cache@v4
        with:
          path: site/media/*/thumbs
          key: thumbs-${{ hashFiles('site/media/**/*.jpg', 'site/media/**/*.jpeg', 'site/media/**/*.png', 'site/media/**/*.webp', 'site/media/**/*.gif') }}
          restore-keys: thumbs-

      - name: Build media index (screenshots, thumbnails, videos)
        run: |
          pip install --quiet pillow
          python scripts/build-media.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
